
  <!-- ===== 工具统计页面 ===== -->
  <div class="page" id="page-tools">
    <div class="page-header">
      <div>
        <h2>
          <i class="icon-fa fa-solid fa-tools" style="margin-right:6px"></i>工具统计
        </h2>
        <p>工具调用次数、耗时与 token 消耗全览</p>
      </div>
    </div>
    <div class="stats-body">
      <!-- 汇总卡片 -->
      <div class="stats-summary" id="toolsStatsSummary">
        <div class="s-card">
          <div class="s-card-icon" style="background:linear-gradient(135deg,#4f6ef7,#6366f1)">
            <i class="icon-fa fa-solid fa-phone"></i>
          </div>
          <div class="s-card-body">
            <div class="s-card-number" id="tsNumCalls">-</div>
            <div class="s-card-label">总调用</div>
          </div>
        </div>
        <div class="s-card">
          <div class="s-card-icon" style="background:linear-gradient(135deg,#00c853,#69f0ae)">
            <i class="icon-fa fa-solid fa-check-circle"></i>
          </div>
          <div class="s-card-body">
            <div class="s-card-number" id="tsNumSuccess">-</div>
            <div class="s-card-label">成功</div>
          </div>
        </div>
        <div class="s-card">
          <div class="s-card-icon" style="background:linear-gradient(135deg,#f44336,#e91e63)">
            <i class="icon-fa fa-solid fa-times-circle"></i>
          </div>
          <div class="s-card-body">
            <div class="s-card-number" id="tsNumErrors">-</div>
            <div class="s-card-label">失败</div>
          </div>
        </div>
        <div class="s-card">
          <div class="s-card-icon" style="background:linear-gradient(135deg,#00bcd4,#4dd0e1)">
            <i class="icon-fa fa-solid fa-font"></i>
          </div>
          <div class="s-card-body">
            <div class="s-card-number" id="tsNumTokens">-</div>
            <div class="s-card-label">总消耗 tokens</div>
          </div>
        </div>
        <div class="s-card">
          <div class="s-card-icon" style="background:linear-gradient(135deg,#7c4dff,#b388ff)">
            <i class="icon-fa fa-solid fa-coins"></i>
          </div>
          <div class="s-card-body">
            <div class="s-card-number" id="tsNumTotalCost">¥0</div>
            <div class="s-card-label">总花费</div>
          </div>
        </div>
      </div>

      <!-- 排行表 -->
      <div class="stats-table-wrap">
        <div class="stats-table-header">
          <h3 style="margin:0;font-size:14px">工具调用排行</h3>
          <span style="font-size:12px;color:var(--text-secondary)" id="toolsStatsPeriod"></span>
        </div>
        <div class="stats-table-scroll" style="max-height:400px">
          <table class="stats-table">
            <thead>
              <tr>
                <th>#</th>
                <th>工具名</th>
                <th class="num">调用</th>
                <th class="num">成功</th>
                <th class="num">失败</th>
                <th class="num">平均耗时(ms)</th>
                <th class="num">输入 tokens</th>
                <th class="num">输出 tokens</th>
                <th class="num">缓存 tokens</th>
                <th class="num">花费</th>
              </tr>
            </thead>
            <tbody id="toolsTableBody"></tbody>
          </table>
        </div>
        <div class="stats-empty" id="toolsEmpty" style="display:none">
          <p>暂无工具调用记录</p>
          <p class="stats-empty-hint">使用工具后，统计数据会自动记录</p>
        </div>
      </div>
    </div>
  </div>
