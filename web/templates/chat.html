  <!-- ===== 聊天页面 ===== -->
   
  <div class="page active" id="page-chat">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="tool-menu-btn" id="toolMenuBtn" onclick="toggleToolPanel()" title="可用工具">
          <i class="icon-fa fa-solid fa-wrench"></i>
        </button>
        <div>
          <h2>
            <i class="icon-fa fa-solid fa-comments" style="margin-right:6px"></i>对话
          </h2>
          <p id="convTitle">新对话</p>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-outline" id="debugBtn" onclick="toggleDebug()">
          <i class="icon-fa fa-solid fa-bug" style="margin-right:4px"></i>调试
        </button>
        <button class="btn btn-sm btn-outline" onclick="openHistory()">
          <i class="icon-fa fa-solid fa-clock" style="margin-right:4px"></i>历史
        </button>
        <button class="btn btn-sm btn-outline" onclick="toggleSkillPanel()">
          <i class="icon-fa fa-solid fa-brain" style="margin-right:4px"></i>技能
        </button>
        <button class="btn btn-sm btn-outline" onclick="newChat()">
          <i class="icon-fa fa-solid fa-plus" style="margin-right:4px"></i>新对话
        </button>
      </div>
    </div>
    <!-- 工具面板 -->
    <div class="tool-panel" id="toolPanel">
      <div class="tool-panel-inner" id="toolPanelInner"></div>
    </div>
    <div class="chat-body">
      <!-- 左列：主聊天 -->
      <div class="chat-col" id="leftCol">
        <div class="drag-hint"><i class="icon-fa fa-solid fa-folder"></i> 拖拽文件到此处上传</div>
        <div class="chat-messages" id="chatMessages">
        <div class="empty-state">
          <div class="big-icon">
          <i class="icon-fa fa-solid fa-hand-wave"></i>
        </div>
          <h3>你好！我是 Nanobuddy</h3>
          <p>你的本地 AI 好伙伴。我可以帮你整理文件、搜索知识库、分析文档、回答问题。在下方输入框开始对话。</p>
        </div>
        </div>
        <div class="chat-input">
          <div class="upload-area" id="filePreview"></div>
          <!-- 快捷命令栏 -->
          <div class="quick-cmd-wrapper">
            <div class="qc-panel" id="quickCmdBar" style="display:none"></div>
          </div>
          <div class="input-shell">
            <div class="input-main">
              <div class="input-placeholder-hint">
                <textarea id="chatInput" rows="1" placeholder="今天帮你做些什么？" onkeydown="onChatKeydown(event)" oninput="autoResizeInput(this)"></textarea>
                <div class="input-aux">
                  <span class="aux-hint" id="inputAuxHint"><i class="icon-fa fa-solid fa-at"></i> 引用对话文件，<span class="aux-link" onclick="toggleQuickCmds()">/</span> 调用技能与指令</span>
                </div>
              </div>
            </div>
            <div class="input-toolbar">
              <div class="toolbar-left">
                <div class="toolbar-chip" onclick="toggleCraftMenu(event)">
                  <i class="icon-fa fa-solid fa-paper-plane"></i> Craft
                  <i class="icon-fa fa-solid fa-chevron-down chip-caret"></i>
                </div>
                <div class="toolbar-chip">
                  <i class="icon-fa fa-solid fa-wand-magic-sparkles"></i> 自动
                  <i class="icon-fa fa-solid fa-chevron-down chip-caret"></i>
                </div>
                <div class="toolbar-chip" onclick="toggleSkillMenu(event)">
                  <i class="icon-fa fa-solid fa-puzzle-piece"></i> 技能
                  <i class="icon-fa fa-solid fa-chevron-down chip-caret"></i>
                </div>
                <div class="toolbar-chip">
                  <i class="icon-fa fa-solid fa-plug"></i> 连应用
                  <i class="icon-fa fa-solid fa-chevron-down chip-caret"></i>
                </div>
                <div class="toolbar-chip">
                  <i class="icon-fa fa-solid fa-shield-halved"></i> 默认权限
                  <i class="icon-fa fa-solid fa-chevron-down chip-caret"></i>
                </div>
              </div>
              <div class="toolbar-right">
                <button class="icon-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="上传文件"><i class="icon-fa fa-solid fa-plus"></i></button>
                <button class="icon-btn" id="compactChatBtn" onclick="compactChatHistory()" title="压缩对话历史"><i class="icon-fa fa-solid fa-wand-magic-sparkles"></i></button>
                <button class="icon-btn" title="语音输入"><i class="icon-fa fa-solid fa-microphone"></i></button>
                <button class="icon-btn send-circle" id="sendBtn" onclick="sendChat()" title="发送"><i class="icon-fa fa-solid fa-arrow-up"></i></button>
                <button class="icon-btn stop-circle" id="stopBtn" onclick="stopStreaming()" style="display:none" title="停止"><i class="icon-fa fa-solid fa-stop"></i></button>
              </div>
            </div>
            <div class="input-footer" onclick="toggleWorkspaceMenu(event)">
              <i class="icon-fa fa-solid fa-folder"></i> 选择工作空间
              <i class="icon-fa fa-solid fa-chevron-right footer-arrow"></i>
            </div>
          </div>
          <input type="file" id="fileInput" style="display:none" multiple onchange="handleFileSelect(event)">
        </div>
      </div>
      <!-- 右列：分屏聊天 -->
      <div class="chat-col split-col" id="rightCol">
        <div class="split-header">
          <h3>分屏对话</h3>
          <button class="btn btn-sm btn-outline" onclick="closeSplit()">
            <i class="icon-fa fa-solid fa-xmark" style="margin-right:4px"></i>关闭
          </button>
        </div>
        <div class="split-msgs" id="splitMessages"></div>
        <div class="chat-input">
          <div class="input-row">
            <textarea id="splitInput" rows="1" placeholder="输入消息，按 Enter 发送..." onkeydown="onSplitKeydown(event)"></textarea>
            <button class="send-btn" onclick="sendSplitChat()">发送</button>
            <button class="stop-btn" id="splitStopBtn" onclick="stopSplitStreaming()" style="display:none"><i class="icon-fa fa-solid fa-stop"></i> 停止</button>
          </div>
        </div>
      </div>
    </div>
    <div class="history-overlay" id="historyOverlay">
      <div class="history-backdrop" onclick="closeHistory()"></div>
      <div class="history-content">
        <div class="ht-title">
          <span>
            <i class="icon-fa fa-solid fa-clock"></i>
          </span> 对话历史
          <div>
            <button class="btn btn-sm btn-outline" onclick="toggleMultiSelect()" id="htMultiBtn">
              <i class="icon-fa fa-solid fa-square-check" style="margin-right:4px"></i>多选
            </button>
            <span style="cursor:pointer;font-size:18px;margin-left:8px" onclick="closeHistory()">
              <i class="icon-fa fa-solid fa-xmark"></i>
            </span>
          </div>
        </div>
        <div class="ht-toolbar" id="htToolbar" style="display:none">
          <button class="btn btn-sm btn-outline" onclick="selectAllHistory()">全选</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSelected()">
            <i class="icon-fa fa-solid fa-trash-can" style="margin-right:4px"></i>删除所选
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteAllHistory()">
            <i class="icon-fa fa-solid fa-trash-can" style="margin-right:4px"></i>删除全部
          </button>
        </div>
        <div class="ht-list" id="historyList"><div style="text-align:center;padding:30px;color:#999">点击加载</div></div>
      </div>
    </div>
    <!-- 技能面板 -->
    <div class="skill-panel" id="skillPanel">
      <div class="skill-panel-backdrop" onclick="toggleSkillPanel()"></div>
      <div class="skill-panel-content">
        <div class="skill-panel-header">
          <h3><i class="icon-fa fa-solid fa-brain"></i> 技能</h3>
          <span style="cursor:pointer;font-size:18px" onclick="toggleSkillPanel()">
            <i class="icon-fa fa-solid fa-xmark"></i>
          </span>
        </div>
        <div class="skill-panel-body" id="skillPanelBody">
          <div style="text-align:center;padding:30px;color:var(--text-secondary)">加载中...</div>
        </div>
      </div>
    </div>
  </div>
