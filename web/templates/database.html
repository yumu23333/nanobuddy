 <!-- ===== 数据库页面 ===== -->
  <div class="page" id="page-database">
    <div class="page-header">
      <div>
        <h2>
          <i class="icon-fa fa-solid fa-database" style="margin-right:6px"></i>数据库
        </h2>
        <p>连接企业数据库，自然语言查询数据</p>
      </div>
    </div>
    <div class="db-body">
      <!-- 左侧（主）：数据源管理 -->
      <div class="db-main">
        <div class="db-main-card">
          <div class="db-section-header">
            <h3>
              <i class="icon-fa fa-solid fa-server" style="margin-right:4px"></i>数据源管理
            </h3>
            <button class="btn btn-primary btn-sm" onclick="showDbConfigForm()"><i class="icon-fa fa-solid fa-plus"></i> 新增</button>
          </div>
          <div id="dbConfigList" class="db-grid-3col"><div class="loading"><div class="spinner"></div>加载中...</div></div>
        </div>
      </div>
      <!-- 右侧（侧栏）：智能问数 -->
      <div class="db-side">
        <div class="db-side-header">
          <h3>
            <i class="icon-fa fa-solid fa-robot" style="margin-right:4px"></i>智能问数
          </h3>
        </div>
        <div class="db-side-select">
          <select id="sqConfigSelect" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg-card);color:var(--text)"><option value="">-- 选择数据源 --</option></select>
        </div>
        <div class="db-side-msgs" id="sqMessages">
          <div class="db-side-empty">用自然语言提问，系统会自动生成SQL查询数据</div>
        </div>
        <div class="db-side-input">
          <textarea id="sqInput" rows="2" placeholder="输入问题…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();executeSmartQuery()}"></textarea>
          <button class="btn btn-primary" onclick="executeSmartQuery()">
            <i class="icon-fa fa-solid fa-paper-plane"></i>
          </button>
        </div>
        <div id="sqProgress" style="display:none;padding:8px 16px;font-size:12px;color:var(--text-secondary)"></div>
      </div>
    </div>
  </div>
