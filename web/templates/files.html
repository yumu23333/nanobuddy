
  <!-- ===== 团队文件页面 ===== -->
  <div class="page" id="page-files">
    <div class="page-header">
      <div>
        <h2>
          <i class="icon-fa fa-solid fa-folder-open" style="margin-right:6px"></i>团队文件
        </h2>
        <p>服务器共享目录与个人空间，支持上传与索引到知识库</p>
      </div>
    </div>
    <div class="fb-content">
      <div class="fb-roots" id="fbRoots"></div>
      <div class="fb-toolbar">
        <div class="fb-path-bar">
          <button class="nav-btn" onclick="goUpDir()" title="上一级"><i class="icon-fa fa-solid fa-arrow-up"></i></button>
          <span class="path-text" id="fbPath">加载中…</span>
          <button class="nav-btn" onclick="refreshFiles()" title="刷新">
            <i class="icon-fa fa-solid fa-rotate"></i>
          </button>
        </div>
        <div class="fb-actions" id="fbActions">
          <input type="file" id="fbUploadInput" multiple style="display:none" onchange="onFbUploadPick(this)">
          <button type="button" class="btn btn-sm btn-primary" id="fbUploadBtn" onclick="triggerFbUpload()" style="display:none">
            <i class="icon-fa fa-solid fa-upload"></i> 上传
          </button>
          <button type="button" class="btn btn-sm btn-outline" id="fbMkdirBtn" onclick="fbCreateFolder()" style="display:none">
            <i class="icon-fa fa-solid fa-folder-plus"></i> 新建文件夹
          </button>
        </div>
      </div>
      <div class="fb-items" id="fbItems"><div class="loading"><div class="spinner"></div>加载中...</div></div>
    </div>
  </div>
