<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Nanobuddy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css?v=VERSION">
<style>
/* 快捷命令栏样式（内联防止缓存） */
.qc-toggle{display:inline-flex;align-items:center;gap:4px;padding:5px 16px;font-size:13px;border:1px solid var(--border);border-radius:20px;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;transition:all .15s;font-family:inherit;font-weight:500}
.qc-toggle:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.qc-toggle.open{background:var(--primary);border-color:var(--primary);color:#fff}
.qc-panel{display:none;margin-top:8px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.qc-panel.open{display:flex;flex-wrap:wrap;gap:6px}
.qc-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;font-size:12px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;transition:all .12s;font-family:inherit}
.qc-btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.qc-btn:active{transform:scale(.96)}
.qc-btn .qc-cmd{font-family:'SF Mono','Cascadia Code',Consolas,monospace;font-weight:600;font-size:11px}
.qc-btn .qc-desc{color:var(--text-secondary);font-size:11px}
.qc-tool-btn{flex-shrink:0;width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-secondary);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qc-tool-btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.qc-tool-btn.open{background:var(--primary);border-color:var(--primary);color:#fff}
/* 技能面板（内联防止缓存） */
.skill-card.active{border-color:var(--success);background:#e8f5e9 !important}
.skill-card-name .active-badge{display:none;font-size:11px;background:var(--success);color:#fff;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:400}
.skill-card.active .skill-card-name .active-badge{display:inline}
</style>
<script>document.addEventListener('DOMContentLoaded',function(){var s=document.createElement('style');s.textContent='.skill-card.active{background:#e8f5e9 !important;border-color:#27ae60 !important}';document.head.appendChild(s);});</script>
<body>

<div id="loginOverlay" class="login-overlay open">
  <div class="login-container">
    <div class="login-left">
      <h2>登录</h2>
      <form id="loginForm" class="login-fields">
        <input type="text" id="loginUsername" placeholder="用户" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" required>
        <div id="loginError" class="login-error"></div>
        <p class="login-forgot"><a href="#" onclick="clearKejiLocalAuth();return false">忘记密码?</a></p>
        <p class="login-hint"><a href="#" onclick="clearKejiLocalAuth();return false">清除本地登录缓存</a>（若提示过期或无法登录可点此）</p>
      </form>
      <button type="submit" form="loginForm" class="btn btn-login btn-login-action">登录</button>
    </div>
    <div class="login-right">
      <h3>嘿,朋友^ ^</h3>
      <p>点击注册，开始我们的旅程</p>
      <button type="button" class="btn btn-register" onclick="showRegisterForm()">注册</button>
    </div>
  </div>
  <div id="registerOverlay" class="register-overlay">
    <div class="register-card">
      <h2>注册账号</h2>
      <form id="registerForm">
        <input type="text" id="registerUsername" placeholder="用户名" required>
        <input type="password" id="registerPassword" placeholder="密码" required>
        <input type="password" id="registerConfirmPassword" placeholder="确认密码" required>
        <div id="registerError" class="register-error"></div>
        <button type="submit" class="btn btn-login">注册</button>
        <p class="register-hint"><a href="#" onclick="hideRegisterForm()">返回登录</a></p>
      </form>
    </div>
  </div>
</div>

<!-- ===== 侧边栏 ===== -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>Nanobuddy</h1>
    <div class="subtitle">你的本地 AI 好伙伴</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-page="chat" onclick="switchPage('chat')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-message"></i>
      </span> 对话
    </div>
    <div class="nav-item" data-page="knowledge" onclick="switchPage('knowledge')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-bookmark"></i>
      </span> 知识库
    </div>
    <div class="nav-item" data-page="files" onclick="switchPage('files')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-folder"></i>
      </span> 团队文件
    </div>
    <div class="nav-item" data-page="settings" onclick="switchPage('settings')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-sliders"></i>
      </span> 设置
    </div>
    <div class="nav-item" data-page="database" onclick="switchPage('database')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-database"></i>
      </span> 数据库
    </div>
    <div class="nav-item" data-page="stats" onclick="switchPage('stats')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-chart-simple"></i>
      </span> 统计
    </div>
    <div class="nav-item" data-page="tools" onclick="switchPage('tools')">
      <span class="icon">
        <i class="icon-fa fa-solid fa-tools"></i>
      </span> 工具
    </div>
    <div class="nav-item" id="navAdmin" data-page="admin" onclick="switchPage('admin')" style="display:none">
      <span class="icon">
        <i class="icon-fa fa-solid fa-user-shield"></i>
      </span> 管理
    </div>
  </nav>
  <div id="userBar" class="sidebar-user" style="display:none">
    <span id="userDisplayName">用户</span>
    <span id="userRoleBadge" class="user-role-badge">成员</span>
    <button type="button" class="btn-logout" onclick="logoutKeji()" title="退出登录">退出</button>
  </div>
  <div class="sidebar-mode">
    <!-- Agent 模式已整合到自动流程中，无需手动切换 -->
  </div>
  
  <div class="sidebar-footer">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">检查连接中...</span>
  </div>
</aside>
<!-- ===== 主内容区 ===== -->
<main class="main">
  <div id="pageContainer"></div>
</main>
<link rel="stylesheet" href="/static/css/style.css?v=VERSION">
<!-- ===== 调试面板 ===== -->
<div class="debug-drawer" id="debugDrawer">
  <div class="dd-header">
    <h3><i class="icon-fa fa-solid fa-bug" style="margin-right:4px"></i> 开发者调试</h3>
    <div style="display:flex;gap:6px">
      <button class="btn btn-sm btn-outline" onclick="clearDebugEvents()" style="font-size:11px;padding:2px 10px">清空</button>
      <button class="btn btn-sm btn-outline" onclick="refreshDebugLogs()" style="font-size:11px;padding:2px 10px">刷新日志</button>
      <span style="cursor:pointer;font-size:16px;color:#8890a4;font-family:var(--font)" onclick="toggleDebug()">
        <i class="icon-fa fa-solid fa-xmark"></i>
      </span>
    </div>
  </div>
  <div class="dd-tabs">
    <div class="dd-tab active" data-dtab="events" onclick="switchDebugTab('events')"><i class="icon-fa fa-solid fa-list-ul" style="margin-right:4px"></i> 事件流</div>
    <div class="dd-tab" data-dtab="tools" onclick="switchDebugTab('tools')"><i class="icon-fa fa-solid fa-wrench" style="margin-right:4px"></i> 工具调用</div>
    <div class="dd-tab" data-dtab="logs" onclick="switchDebugTab('logs')"><i class="icon-fa fa-solid fa-file-lines" style="margin-right:4px"></i> 日志</div>
    <div class="dd-tab" data-dtab="raw" onclick="switchDebugTab('raw')"><i class="icon-fa fa-solid fa-code" style="margin-right:4px"></i> Raw JSON</div>
  </div>
  <div class="dd-body" id="ddBody"><div class="dd-empty">等待对话事件...</div></div>
  <div class="dd-bar" id="ddBar">事件: 0 | 工具调用: 0 | 等待中...</div>
</div>
<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>
<script src="/static/js/core.js?v=VERSION"></script>
<script src="/static/js/auth.js?v=VERSION"></script>
<script src="/static/js/chat.js?v=VERSION"></script>
<script src="/static/js/pages.js?v=VERSION"></script>
<script src="/static/js/init.js?v=VERSION"></script>
<script src="/static/js/history.js?v=VERSION"></script>
<!-- ===== 调试面板 JS ===== -->
<script src="/static/js/debug.js?v=VERSION"></script>
<div class="ctx-menu" id="ctxMenu"></div>
</body>
</html>
